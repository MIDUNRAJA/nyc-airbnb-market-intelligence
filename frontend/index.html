<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F5" />
    <meta
      name="description"
      content="NYC Airbnb Market Intelligence — an interactive data science case study of 48,870 listings."
    />
    <title>NYC Airbnb Market Intelligence | FODS Case Study</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Space Grotesk', 'Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            colors: {
              airbnb: {
                coral: '#FF5A5F',
                darkCoral: '#E04A4F',
                lightCoral: '#FFF0F1',
                teal: '#00A699',
                orange: '#FC642D',
                charcoal: '#222222',
                slate: '#484848',
                lightBg: '#FAF9F5',
                cardBg: '#FFFFFF',
                border: '#EBEBEB',
              },
              ink: {
                50: '#f7f7f8',
                100: '#eceef1',
                400: '#8b8f98',
                500: '#5f6470',
                700: '#33373f',
                900: '#14161a',
              },
              accent: {
                violet: '#8B5CF6',
                indigo: '#6366F1',
                pink: '#EC4899',
                cyan: '#06B6D4',
              },
            },
            boxShadow: {
              xs: '0 1px 2px 0 rgba(16,24,40,0.05)',
              soft: '0 12px 40px -12px rgba(16,24,40,0.18)',
              glow: '0 0 0 1px rgba(255,90,95,0.14), 0 18px 60px -18px rgba(255,90,95,0.45)',
              card: '0 1px 3px rgba(16,24,40,0.06), 0 14px 40px -22px rgba(16,24,40,0.28)',
            },
            animation: {
              'float': 'float 7s ease-in-out infinite',
              'float-slow': 'float 11s ease-in-out infinite',
              'blob': 'blob 20s ease-in-out infinite',
              'gradient-x': 'gradient-x 8s ease infinite',
              'shimmer': 'shimmer 1.2s ease',
              'marquee': 'marquee 34s linear infinite',
              'spin-slow': 'spin 16s linear infinite',
              'pulse-soft': 'pulse-soft 3.2s ease-in-out infinite',
              'rise': 'rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-14px)' },
              },
              blob: {
                '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(48px, -36px) scale(1.12)' },
                '66%': { transform: 'translate(-36px, 28px) scale(0.94)' },
              },
              'gradient-x': {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              shimmer: {
                '0%': { transform: 'translateX(-130%)' },
                '100%': { transform: 'translateX(130%)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              'pulse-soft': {
                '0%, 100%': { opacity: '1', transform: 'scale(1)' },
                '50%': { opacity: '0.55', transform: 'scale(1.35)' },
              },
              rise: {
                '0%': { opacity: '0', transform: 'translateY(14px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --cursor-x: 50vw;
        --cursor-y: 50vh;
      }

      html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background-color: #f6f5f2;
        color: #222222;
        font-family: 'Inter', system-ui, sans-serif;
      }

      ::selection {
        background: rgba(255, 90, 95, 0.22);
        color: #14161a;
      }

      /* ---------- Scrollbars ---------- */
      ::-webkit-scrollbar {
        width: 9px;
        height: 9px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #ff8b8f, #ff5a5f);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #ff5a5f, #e04a4f);
        background-clip: content-box;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* ---------- Cursor-reactive layers ---------- */
      .cursor-glow {
        position: fixed;
        top: 0;
        left: 0;
        width: 620px;
        height: 620px;
        border-radius: 9999px;
        pointer-events: none;
        z-index: 5;
        transform: translate3d(-50%, -50%, 0);
        background: radial-gradient(
          circle,
          rgba(255, 90, 95, 0.16) 0%,
          rgba(139, 92, 246, 0.1) 38%,
          rgba(0, 166, 153, 0.06) 58%,
          transparent 72%
        );
        filter: blur(14px);
        transition: opacity 0.4s ease;
        will-change: transform;
      }
      .cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        width: 34px;
        height: 34px;
        border-radius: 9999px;
        border: 1.5px solid rgba(255, 90, 95, 0.55);
        pointer-events: none;
        z-index: 61;
        transform: translate3d(-50%, -50%, 0);
        transition:
          width 0.22s cubic-bezier(0.22, 1, 0.36, 1),
          height 0.22s cubic-bezier(0.22, 1, 0.36, 1),
          background 0.22s ease,
          border-color 0.22s ease,
          opacity 0.3s ease;
        will-change: transform;
      }
      .cursor-ring.is-hover {
        width: 62px;
        height: 62px;
        background: rgba(255, 90, 95, 0.08);
        border-color: rgba(255, 90, 95, 0.85);
      }
      .cursor-ring.is-down {
        width: 26px;
        height: 26px;
      }

      /* ---------- Aurora / ambient background ---------- */
      .bg-dots {
        background-image: radial-gradient(rgba(20, 22, 26, 0.055) 1px, transparent 1px);
        background-size: 22px 22px;
      }
      .bg-grid {
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 44px 44px;
      }

      /* ---------- Glass ---------- */
      .glass {
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(18px) saturate(180%);
        -webkit-backdrop-filter: blur(18px) saturate(180%);
      }
      .glass-dark {
        background: rgba(20, 22, 26, 0.55);
        backdrop-filter: blur(18px) saturate(160%);
        -webkit-backdrop-filter: blur(18px) saturate(160%);
      }

      /* ---------- Gradient text ---------- */
      .text-gradient {
        background: linear-gradient(120deg, #ff5a5f, #fc642d, #8b5cf6, #06b6d4, #00a699, #ff5a5f);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: gradient-x 9s ease infinite;
      }

      /* ---------- Shimmer sweep on hover ---------- */
      .shimmer {
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .shimmer::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-130%);
        background: linear-gradient(
          110deg,
          transparent 30%,
          rgba(255, 255, 255, 0.5) 50%,
          transparent 70%
        );
        pointer-events: none;
      }
      .shimmer:hover::after {
        animation: shimmer 1.2s ease;
      }

      /* ---------- Spotlight card (cursor-reactive) ---------- */
      .spotlight-card {
        position: relative;
        overflow: hidden;
      }
      .spotlight-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          420px circle at var(--mx, 50%) var(--my, 50%),
          rgba(255, 90, 95, 0.14),
          transparent 62%
        );
        opacity: 0;
        transition: opacity 0.35s ease;
        pointer-events: none;
        z-index: 1;
      }
      .spotlight-card:hover::before {
        opacity: 1;
      }
      .spotlight-card > * {
        position: relative;
        z-index: 2;
      }

      /* ---------- Tilt ---------- */
      .tilt {
        transform-style: preserve-3d;
        transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform;
      }

      /* ---------- Scroll reveal ---------- */
      .reveal {
        opacity: 0;
        transform: translateY(26px);
        transition:
          opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }
      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* ---------- Page transition ---------- */
      @keyframes pageEnter {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.995);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .page-enter {
        animation: pageEnter 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* ---------- Loader ---------- */
      @keyframes bootFade {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f5f2;
        animation: bootFade 0.5s ease 0.55s forwards;
      }
      #boot .boot-ring {
        width: 46px;
        height: 46px;
        border-radius: 9999px;
        border: 3px solid rgba(255, 90, 95, 0.18);
        border-top-color: #ff5a5f;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------- Marquee ---------- */
      .marquee-track {
        display: flex;
        width: max-content;
        animation: marquee 34s linear infinite;
      }
      .marquee-track:hover {
        animation-play-state: paused;
      }

      /* ---------- Nav underline ---------- */
      .nav-item {
        position: relative;
      }
      .nav-item::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 4px;
        height: 2px;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff5a5f, #8b5cf6);
        transform: translateX(-50%);
        transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .nav-item:hover::after {
        width: 60%;
      }
      .nav-item.is-active::after {
        width: 0;
      }

      /* ---------- Misc utilities ---------- */
      .shadow-xs {
        box-shadow: 0 1px 2px 0 rgba(16, 24, 40, 0.05);
      }
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* ---------- Motion tokens ---------- */
      :root {
        --ease-premium: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
        --dur-fast: 180ms;
        --dur-base: 320ms;
        --dur-slow: 620ms;
        --dur-cinematic: 900ms;
      }

      /* ---------- Accessibility ---------- */
      :focus-visible {
        outline: 2px solid rgba(255, 90, 95, 0.8);
        outline-offset: 2px;
        border-radius: 6px;
      }
      .skip-link {
        position: absolute;
        left: -999px;
        top: 8px;
        z-index: 200;
      }
      .skip-link:focus {
        left: 16px;
        padding: 10px 16px;
        border-radius: 12px;
        background: #14161a;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }

      /* ---------- Word-by-word text reveal ---------- */
      .reveal-text .word {
        display: inline-block;
        opacity: 0;
        transform: translateY(0.7em);
        transition:
          opacity var(--dur-cinematic) var(--ease-premium),
          transform var(--dur-cinematic) var(--ease-premium);
        will-change: opacity, transform;
      }
      .reveal-text.is-visible .word {
        opacity: 1;
        transform: translateY(0);
      }

      /* ---------- Subtle film grain ---------- */
      .grain::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.5;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.42'/></svg>");
      }

      /* ---------- Premium range slider ---------- */
      input[type='range'].range-premium {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff5a5f, #fc642d, #8b5cf6);
        outline: none;
        cursor: pointer;
      }
      input[type='range'].range-premium::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: #ffffff;
        border: 2px solid #ff5a5f;
        box-shadow: 0 3px 12px rgba(255, 90, 95, 0.5);
        transition: transform var(--dur-fast) var(--ease-premium);
      }
      input[type='range'].range-premium::-webkit-slider-thumb:hover {
        transform: scale(1.18);
      }
      input[type='range'].range-premium::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #ffffff;
        border: 2px solid #ff5a5f;
        box-shadow: 0 3px 12px rgba(255, 90, 95, 0.5);
        cursor: pointer;
      }
      input[type='range'].range-premium:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ---------- Scroll cue + pop ---------- */
      @keyframes scrollCue {
        0% { transform: translateY(0); opacity: 0; }
        40% { opacity: 1; }
        100% { transform: translateY(11px); opacity: 0; }
      }
      .scroll-cue-dot {
        animation: scrollCue 1.9s var(--ease-soft) infinite;
      }
      @keyframes popIn {
        from { opacity: 0; transform: scale(0.94); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-pop {
        animation: popIn var(--dur-base) var(--ease-premium) both;
      }

      /* ---------- Skeleton shimmer ---------- */
      @keyframes skeleton {
        100% { transform: translateX(100%); }
      }
      .skeleton {
        position: relative;
        overflow: hidden;
        background: #eceef1;
      }
      .skeleton::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85), transparent);
        animation: skeleton 1.4s infinite;
      }

      @media (hover: none), (pointer: coarse) {
        .cursor-glow,
        .cursor-ring {
          display: none !important;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        .reveal {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="boot-ring"></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
